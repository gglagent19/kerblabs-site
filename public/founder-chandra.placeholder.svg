<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="Chandra Alladi placeholder avatar">
  <title>Chandra Alladi placeholder avatar</title>
