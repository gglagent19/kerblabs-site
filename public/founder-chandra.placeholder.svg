  <rect width="560" height="560" fill="url(#bg)"/>
  <circle cx="280" cy="280" r="200" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <circle cx="280" cy="280" r="160" fill="#0f0f0f"/>
  <text x="280" y="320" text-anchor="middle"
